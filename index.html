<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHiA - Chatbot de RRHH</title>
    <link id="favicon" rel="icon" href="">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'rhia-dark': '#202123',
                        'rhia-gray': '#343541',
                        'rhia-light-gray': '#444654',
                        'rhia-accent': '#00a99d',
                        'rhia-accent-hover': '#007a70',
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="font-sans bg-white dark:bg-rhia-dark text-gray-800 dark:text-gray-200">

    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 bg-gray-100 dark:bg-rhia-gray p-4 flex-shrink-0 flex-col absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-200 ease-in-out z-20">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center">
                    <div id="logo-container" class="w-8 h-8 mr-2">
                        <svg id="rhia-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#00a99d;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#007a70;stop-opacity:1" />
                                </linearGradient>
                            </defs>
                            <path d="M50 2 L93 25 L93 75 L50 98 L7 75 L7 25 Z" fill="none" stroke="url(#grad1)" stroke-width="5"/>
                            <path d="M50 2 L50 35 M7 25 L40 42 M7 75 L40 58 M93 25 L60 42 M93 75 L60 58 M50 98 L50 65" stroke="#4a5568" stroke-width="2"/>
                            <circle cx="50" cy="50" r="10" fill="url(#grad1)"/>
                        </svg>
                    </div>
                    <h1 class="text-xl font-bold">RHiA</h1>
                </div>
                <button id="close-sidebar-btn" class="md:hidden p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <div class="flex-grow">
                <h2 class="text-lg font-semibold mb-2">Base de Conocimiento</h2>

                <!-- Carga de Documentos de Empresa -->
                <label for="file-upload-empresa" class="w-full text-center cursor-pointer bg-rhia-accent text-white font-bold py-2 px-4 rounded hover:bg-rhia-accent-hover transition-colors duration-200 block">
                    Cargar Docs. Empresa
                </label>
                <input type="file" id="file-upload-empresa" multiple class="hidden" data-type="empresa"/>
                <div id="document-list-empresa" class="mt-2 mb-4 text-sm space-y-1"></div>

                <!-- Carga de Conocimiento General -->
                <label for="file-upload-general" class="w-full text-center cursor-pointer bg-rhia-light-gray text-gray-800 dark:text-white font-bold py-2 px-4 rounded hover:bg-gray-400 dark:hover:bg-gray-600 transition-colors duration-200 block">
                    Cargar Conoc. General
                </label>
                <input type="file" id="file-upload-general" multiple class="hidden" data-type="general"/>
                <div id="document-list-general" class="mt-2 text-sm space-y-1"></div>
            </div>

            <div id="stats-container" class="text-sm">
                <h2 class="text-lg font-semibold mb-2">Estadísticas</h2>
                <div class="space-y-1">
                    <p>Preguntas: <span id="stats-questions" class="font-semibold float-right">0</span></p>
                    <p>Útil: <span id="stats-useful" class="font-semibold float-right">0</span></p>
                    <p>No útil: <span id="stats-not-useful" class="font-semibold float-right">0</span></p>
                </div>
                <button id="export-chat-btn" class="w-full mt-4 bg-gray-300 dark:bg-rhia-light-gray hover:bg-gray-400 dark:hover:bg-gray-600 font-bold py-2 px-4 rounded transition-colors duration-200">
                    Exportar Chat
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col relative">
            <!-- Header for mobile -->
            <header class="md:hidden p-2 border-b border-gray-200 dark:border-rhia-light-gray flex items-center">
                <button id="open-sidebar-btn" class="p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <h1 class="text-lg font-bold mx-auto">RHiA</h1>
            </header>

            <div id="chat-container" class="flex-1 p-6 overflow-y-auto">
                <!-- Mensajes de bienvenida y estado inicial -->
                <div id="status-container" class="text-center mb-4 p-2 text-gray-500">
                    <p id="status-message">Bienvenido a RHiA. Sube tus documentos para comenzar.</p>
                </div>
            </div>

            <!-- Chat Input -->
            <div class="p-4 border-t border-gray-200 dark:border-rhia-light-gray">
                <div class="relative max-w-3xl mx-auto">
                    <textarea id="user-input" class="w-full p-3 pr-12 border border-gray-300 dark:border-rhia-light-gray rounded-lg bg-white dark:bg-rhia-gray focus:outline-none focus:ring-2 focus:ring-rhia-accent resize-none" placeholder="Escribe tu pregunta aquí..." rows="1" disabled></textarea>
                    <button id="send-button" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 bg-rhia-accent rounded-full text-white hover:bg-rhia-accent-hover disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors duration-200" disabled aria-label="Enviar mensaje">
                        <!-- Icono de Enviar -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.9/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.4/xlsx.full.min.js"></script>
    <script src="model.js"></script>
    <script src="view.js"></script>
    <script src="controller.js"></script>
</body>
</html>
